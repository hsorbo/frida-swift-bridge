name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [xcode-27, macos-26, macos-26-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  macos-arm64e:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: SDKROOT=$(xcrun --show-sdk-path) npm run test:macos-arm64e

  # QuickJS on arm64 Windows evaluates Infinity as NaN (Frida 17.22.1), which breaks the runner's
  # deep equality on zeros, so this job tests on V8.
  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE
          build_arch: arm64

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:v8

  linux:
    strategy:
      fail-fast: false
      matrix:
        swift: ["5.7-jammy", "5.10-noble", "6.0-noble", "6.1-noble", "6.2-noble", "6.3-noble"]
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    container:
      image: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
